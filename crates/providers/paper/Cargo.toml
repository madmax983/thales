[package]
name = "paper-provider"
version = "0.1.0"
edition = "2024"
description = "A local paper trading provider for Thales CLI"
license = "MIT"

[dependencies]
contracts = { path = "../../contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
