[package]
name = "jev-provider"
version = "0.1.0"
edition = "2024"
description = "TypeSafe AI System One (Jev) client for Thales CLI"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }

[dev-dependencies]
mockito = "1"
