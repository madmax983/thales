[package]
name = "strategies"
version = "0.1.0"
edition = "2021"

[features]
nova = []

[dependencies]
contracts = { path = "../contracts" }
anyhow = "1.0"
async-trait = "0.1"
polars = { version = "0.42.0", features = ["lazy", "dtype-datetime", "random", "strings", "rolling_window"] }
rust_decimal = { version = "1.33", features = ["maths"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
chrono = "0.4.44"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "test-util"] }
