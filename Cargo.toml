[workspace]
members = [
  "crates/contracts",
  "crates/providers/alpaca",
  "crates/providers/jev",
  "crates/providers/kraken",
  "crates/providers/paper",
  "crates/providers/yahoo",
  "crates/cli",
  "crates/strategies",
  "crates/volatility",
  "crates/options",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "cookies"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
